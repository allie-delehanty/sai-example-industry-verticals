    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <div class="ck-content"><p>A hospice assessment is an opportunity for a hospice professional to learn about your loved one's condition, current needs, and goals for care. It also gives your family time to ask questions and better understand what hospice support could look like.</p><p>Before the assessment, consider gathering information that may help the hospice team understand the patient's situation. You do not need to have every answer. Bring what is available and use the conversation to identify anything else that may be needed.</p><p>Helpful information may include:</p><ul><li>The patient's diagnoses and recent changes in health</li><li>Current symptoms, pain levels, or concerns about comfort</li><li>A list of medications and medical equipment currently in use</li><li>Contact information for the patient's physicians and care providers</li><li>Insurance information</li><li>Advance directives or written care preferences, if available</li><li>The patient's preferred setting for care</li><li>Questions from the patient, family, or primary caregiver</li></ul><p>Families may also want to decide who should participate in the conversation. This could include the patient, close family members, a chosen decision-maker, or the person who would serve as the primary caregiver at home.</p><p>During the assessment, the hospice professional can discuss eligibility, explain available services, and learn about the patient's physical, emotional, psychosocial, and spiritual needs. The family can also ask about visit schedules, medications, equipment, caregiver support, and how to reach the team when help is needed.</p><p>Preparing ahead does not commit your family to hospice care. It simply helps create a more complete, informed conversation about the options available to your loved one.</p></div>
