      Value: On March 27, 2026, the NWMO highlighted collaboration with international partners including Finland, Sweden, France, and Switzerland on deep geological repository development. Through the NEA and bilateral agreements, the NWMO exchanges research on containers, buffers, and geosphere characterization. International cooperation supports harmonized safety standards and public confidence globally.
