      Value: "On February 19, 2026, the NWMO announced a grant of advanced microscopy and analytical equipment to support local geoscience research in potential repository host areas. The investment enables high-resolution imaging and elemental analysis of rock and groundwater samples. The initiative reflects the NWMO's commitment to community-led science and lasting research infrastructure."
