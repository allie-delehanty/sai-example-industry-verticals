    - ID: "581d7a02-ce94-4a73-9add-258867a8b60f"
      Hint: Content
      Value: |
        <div class="ck-content"><p>Develop and validate your molecular diagnostic assays faster with relevant, ready-to-use reference materials.</p><p>ATCC quantitative genomic and synthetic nucleic acids are designed for accuracy, confidence, and reproducibility—helping diagnostic developers power assays from design through control.</p><p>Find the assay development tools you need to build better, more reliable molecular diagnostics.</p><p><a href="https://www.atcc.org/applications/molecular-diagnostics-development">Explore molecular diagnostics tools at ATCC</a>.</p></div>
