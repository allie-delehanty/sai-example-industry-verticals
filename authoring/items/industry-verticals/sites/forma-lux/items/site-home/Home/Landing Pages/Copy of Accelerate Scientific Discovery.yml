    - ID: "6b43d550-6d5f-46ce-ac84-3d9493c45bc6"
      Hint: metadataDescription
      Value: |
        Descubre La Colección Lumina de Forma Lux: una serie curada de sofás modulares, sillas de acento y mesas hechas a mano que traen armonía, luz y longevidad a tu hogar. Diseñada para el equilibrio y la belleza sostenible, cada pieza refleja la filosofía de Forma Lux de vida refinada.
        Si estás explorando qué muebles complementarían tu espacio, La Colección Lumina ofrece materiales naturales cálidos, siluetas modernas y versatilidad modular que se adaptan bellamente a cualquier interior.
