    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <div class="ck-content"><p>Contacting VITAS does not mean your family has to make every decision immediately. The first meeting is a chance to talk openly about your loved one's condition, priorities, and goals for care while learning how hospice may be able to help.</p><p>A VITAS admissions specialist may speak with the patient, family, and current physician to help determine whether hospice eligibility requirements are met. The discussion may also cover where care would take place, what support the family needs, and what matters most to the patient.</p><p>It can be helpful to bring questions and any information your family already has about the patient's medical history, current symptoms, medications, physicians, insurance coverage, and care preferences.</p><p>During the conversation, families may want to ask:</p><ul><li>What services would be included in the plan of care?</li><li>Who would be part of the hospice care team?</li><li>How would pain and other symptoms be managed?</li><li>What support is available for family caregivers?</li><li>Who should the family contact when questions or changes arise?</li><li>What happens if the patient's needs change?</li></ul><p>The VITAS team can explain the next steps and answer questions about beginning care. If hospice is appropriate and the family chooses to move forward, the care team works with the patient, family, and physicians to develop a plan centered on the patient's needs and wishes.</p><p>Taking time to prepare for the first meeting can make the conversation feel more manageable and help your family make an informed decision together.</p></div>
