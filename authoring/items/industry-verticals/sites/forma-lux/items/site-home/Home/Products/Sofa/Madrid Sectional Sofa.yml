    - ID: "e35644f6-b680-4f40-9c7a-def95adfedda"
      Hint: LongDescription
      Value: |
        <div class="ck-content"><p>A fundamental principle of Canada's plan for used nuclear fuel is that the NWMO will only proceed with a site where the host community is both informed and willing. This means communities have access to comprehensive information and make their own decision about whether to host the repository.</p><p>The NWMO provides communities with technical, social, and economic information through open houses, workshops, presentations, and ongoing dialogue. Communities can ask questions, review studies, and take the time they need to understand the project before making a decision.</p><p>Informed and willing hosts are essential to the success of Canada's plan and reflect a commitment to respect, transparency, and community autonomy in this generational project.</p></div>
    - ID: "e5b1f5b3-a36d-4fd3-8df7-c9878ebfb6cf"
      Hint: pageSummary
      Value: Canada's plan requires that host communities be fully informed and willing before the NWMO proceeds with a deep geological repository site.
