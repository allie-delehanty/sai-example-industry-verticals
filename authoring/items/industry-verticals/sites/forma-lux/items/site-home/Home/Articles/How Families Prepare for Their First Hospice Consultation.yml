    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <div class="ck-content"><p>Reaching out to a hospice provider can feel like a significant step, but the first consultation is primarily a conversation. It gives the patient and family an opportunity to describe what is happening, learn how hospice works, and decide whether an evaluation or additional discussion would be helpful.</p><p>You do not need to have every answer before the consultation. Gathering a few details can make the conversation easier and help the hospice representative understand your loved one's situation.</p><p>Before the conversation, consider gathering:</p><ul><li>The patient's current diagnoses and recent changes in health</li><li>A list of medications, treatments, and medical equipment</li><li>Recent hospitalizations, emergency visits, or changes in daily function</li><li>The names and contact information of current physicians and care providers</li><li>Insurance information</li><li>Advance directives or documented care preferences, if available</li><li>Questions from the patient, family, or primary caregiver</li><li>Information about where the patient would prefer to receive care</li></ul><p>Your family may also want to discuss:</p><ul><li>What comfort and quality of life mean to the patient</li><li>Which family members or caregivers should participate in care decisions</li><li>What support caregivers may need at home</li><li>Any cultural, spiritual, communication, or personal preferences the care team should understand</li><li>Concerns about symptoms, safety, costs, or what happens next</li></ul><p>During the consultation, ask the hospice representative to explain eligibility, services, care settings, caregiver support, and how the team responds when symptoms or needs change. It is also appropriate to ask what the next step would be if the family decides to move forward.</p><p>A consultation does not obligate your family to begin hospice care. It is a way to gather information, clarify priorities, and understand what support may be available for your loved one and family.</p></div>
