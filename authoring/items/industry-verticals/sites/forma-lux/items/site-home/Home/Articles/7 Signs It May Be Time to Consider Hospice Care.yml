      Hint: Content
      Value: |
        <div class="ck-content"><p>Families often wonder how they will know when it is time to consider hospice care. There is rarely one single moment that makes the decision obvious. Instead, families may notice a pattern of changes that suggests their loved one needs more comfort, support, and help managing a serious illness.</p><p>The following signs do not determine hospice eligibility on their own, but they may indicate that it is time to talk with a physician or hospice provider.</p><ol><li><strong>More frequent hospital or emergency room visits.</strong> Repeated hospitalizations or emergency visits may signal that an illness is becoming harder to manage with the current care plan.</li><li><strong>Symptoms are becoming more difficult to manage.</strong> Increasing pain, shortness of breath, nausea, anxiety, or other symptoms may create a need for more specialized comfort-focused support.</li><li><strong>A noticeable decline in daily activities.</strong> A loved one may need more help bathing, dressing, eating, walking, or moving safely from one place to another.</li><li><strong>Less interest in food or ongoing weight loss.</strong> Changes in appetite, eating, or weight can occur as a serious illness progresses and may be important to discuss with the care team.</li><li><strong>Increasing weakness, fatigue, or time spent sleeping.</strong> A loved one may have less energy for familiar routines, conversations, or activities and may spend more time resting.</li><li><strong>Treatments are no longer helping as expected.</strong> A physician may explain that treatment is no longer controlling the illness or that the burden of treatment is outweighing its benefit.</li><li><strong>The focus of care is shifting toward comfort.</strong> The patient and family may begin prioritizing comfort, time together, and quality of life rather than additional curative treatment.</li></ol><p>If several of these signs feel familiar, your family does not have to make a decision alone. A hospice evaluation can provide more information about eligibility, available services, and whether hospice may be appropriate now or in the future.</p><p>Asking for an evaluation does not require a commitment to begin hospice care. It is an opportunity to understand your options and make an informed decision centered on your loved one's goals and wishes.</p></div>
