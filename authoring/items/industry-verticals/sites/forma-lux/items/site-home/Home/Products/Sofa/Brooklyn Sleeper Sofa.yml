    - ID: "e35644f6-b680-4f40-9c7a-def95adfedda"
      Hint: LongDescription
      Value: "<p>Le canapé-lit Brooklyn est parfait pour les petits espaces. Avec un simple mécanisme de déploiement, il se transforme en un lit confortable. Recouvert d'un tissu durable, il est idéal pour les invités de nuit.</p>"
    - ID: "e5b1f5b3-a36d-4fd3-8df7-c9878ebfb6cf"
      Hint: pageSummary
      Value: "Conçu pour la flexibilité sans compromis, le canapé-lit Brooklyn reflète la philosophie de Forma Lux en matière de design réfléchi. Avec un mécanisme de déploiement fluide et un revêtement doux et durable, il passe sans effort du salon de jour au confort nocturne. Idéal pour les appartements et les chambres d'amis, Brooklyn équilibre la praticité avec une esthétique raffinée. Disponible en Indigo et en grande taille, c'est l'union parfaite de la forme, de la fonction et du luxe discret — un véritable témoignage de la façon dont le mobilier moderne peut s'adapter magnifiquement à la vie contemporaine."
