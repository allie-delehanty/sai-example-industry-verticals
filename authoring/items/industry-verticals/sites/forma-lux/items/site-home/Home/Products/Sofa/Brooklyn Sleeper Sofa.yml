    - ID: "e35644f6-b680-4f40-9c7a-def95adfedda"
      Hint: LongDescription
      Value: |
        <div class="ck-content"><p>Canada's approach to selecting a site for the deep geological repository is community-driven. The NWMO will only proceed with a site where the host community is informed and willing to accept the project.</p><p>This process involves extensive engagement with communities, Indigenous peoples, and stakeholders to ensure everyone has access to the information needed to make informed decisions. Technical studies, social and economic assessments, and ongoing dialogue are all part of this collaborative approach.</p><p>Community-driven site selection reflects Canada's commitment to transparency, respect for Indigenous rights, and the principle that no community will be asked to host the repository without its consent.</p></div>
    - ID: "e5b1f5b3-a36d-4fd3-8df7-c9878ebfb6cf"
      Hint: pageSummary
      Value: "Site selection for Canada's deep geological repository is community-driven, with extensive engagement ensuring informed and willing host communities."
