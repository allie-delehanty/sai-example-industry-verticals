    - ID: "e35644f6-b680-4f40-9c7a-def95adfedda"
      Hint: LongDescription
      Value: <p>El Sofá Cama Brooklyn es perfecto para espacios pequeños. Con un simple mecanismo de extracción, se transforma en una cama cómoda. Tapizado en tela duradera, es ideal para invitados nocturnos.</p>
    - ID: "e5b1f5b3-a36d-4fd3-8df7-c9878ebfb6cf"
      Hint: pageSummary
      Value: Diseñado para la flexibilidad sin comprometer, el Sofá Cama Brooklyn refleja la filosofía de diseño intencionado de Forma Lux. Con un mecanismo de extracción suave y una tapicería suave y duradera, se transforma sin esfuerzo de un lugar de descanso diurno a un confort nocturno. Ideal para apartamentos y habitaciones de invitados, Brooklyn equilibra la practicidad con una estética refinada. Disponible en tamaño grande y color índigo, es la unión perfecta de forma, función y lujo discreto — un verdadero testimonio de cómo los muebles modernos pueden adaptarse bellamente a la vida contemporánea.
