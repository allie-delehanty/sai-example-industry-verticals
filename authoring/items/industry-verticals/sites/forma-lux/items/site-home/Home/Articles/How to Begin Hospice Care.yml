    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <div class="ck-content"><p>Beginning hospice care often starts with a phone call. A patient, family member, caregiver, or healthcare professional can contact a hospice provider to ask questions and request an evaluation.</p><p>The first step is to share information about the patient's illness, recent changes, symptoms, and goals for care. A hospice admissions specialist can then work with the patient and current physician to help determine whether hospice eligibility requirements are met.</p><p>If hospice is appropriate, the next steps may include:</p><ul><li>Reviewing available services and levels of care</li><li>Discussing where the patient would prefer to receive care</li><li>Confirming coverage and completing admission documents</li><li>Identifying the patient's priorities and family caregiver needs</li><li>Coordinating with the patient's physician and hospice physician</li><li>Developing an individualized plan of care</li><li>Arranging needed medications, supplies, or medical equipment</li><li>Scheduling visits from members of the hospice team</li></ul><p>Once admission is complete, the hospice team begins coordinating care around the patient's needs. Team members may include a physician, nurse, hospice aide, social worker, chaplain, volunteer, and bereavement specialist. Visits are scheduled based on the plan of care, and the family receives information about whom to contact with questions or changes in symptoms.</p><p>Hospice care is centered on the patient and family. Sharing your loved one's wishes, routines, concerns, and goals helps the team provide support that reflects what matters most.</p><p>You do not have to navigate the process alone. A conversation with VITAS can help your family understand whether hospice is the right next step and what support is available.</p></div>
