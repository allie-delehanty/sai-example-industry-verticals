    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: |
        <div class="ck-content"><p>La Dra. Sarah Patel es una neumóloga certificada que se especializa en el diagnóstico y tratamiento de enfermedades pulmonares y respiratorias. Está dedicada a ayudar a los pacientes a mejorar su calidad de vida mediante planes de tratamiento personalizados, educación y cuidado preventivo. La Dra. Patel trata una amplia gama de afecciones respiratorias, incluyendo enfermedad pulmonar obstructiva crónica (EPOC), asma, fibrosis pulmonar, trastornos respiratorios relacionados con el sueño e infecciones respiratorias crónicas. Trabaja estrechamente con los pacientes para ayudarles a comprender mejor sus síntomas y desarrollar estrategias para la salud pulmonar a largo plazo. A través de un enfoque colaborativo y compasivo, la Dra. Patel empodera a los pacientes para que asuman un papel activo en el manejo de su salud mientras brinda el apoyo y la experiencia necesarios para enfrentar condiciones respiratorias complejas.</p></div>
