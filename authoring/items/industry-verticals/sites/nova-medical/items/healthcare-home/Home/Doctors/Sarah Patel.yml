    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: |
        <div class="ck-content"><p>Dr. Sarah Patel is a board-certified pulmonologist with extensive expertise in diagnosing and managing a broad spectrum of lung and respiratory conditions. Her clinical focus encompasses chronic obstructive pulmonary disease (COPD), asthma, pulmonary fibrosis, sleep-related breathing disorders, and chronic respiratory infections. Dr. Patel is committed to empowering patients by developing evidence-based, personalized treatment plans that incorporate education and preventive care strategies. She is dedicated to ensuring patients fully understand their symptoms and treatment options, enabling them to make informed decisions about their care. Additionally, Dr. Patel adopts a collaborative approach, working closely with patients to devise long-term strategies for optimizing lung health and managing complex respiratory conditions effectively. Her compassionate care and wealth of knowledge provide patients with the tools and support needed to lead healthier lives.</p></div>
